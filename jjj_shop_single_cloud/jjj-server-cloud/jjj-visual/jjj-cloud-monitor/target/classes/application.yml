server:
  port: 7002
spring:
  boot:
    admin:
      ui:
        title: jjjCloud监控中心
      client:
        instance:
          metadata:
            tags:
              environment: local
  security:
    user:
      name: "admin"
      password: "admin"
  application:
    name: jjj-monitor
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: single
        metadata:
          user.name: ${spring.security.user.name}
          user.password: ${spring.security.user.password}
# 服务端点检查
management:
  httpexchanges:
    recording:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
